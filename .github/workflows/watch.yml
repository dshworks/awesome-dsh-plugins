# Scheduled ecosystem discovery with a single reused triage PR.
#
# Anti-PR-spam design: one fixed branch, rebuilt from fresh main every run,
# force-pushed, and the existing open PR is retitled instead of opening a
# duplicate. Zero candidates found means zero pushes and zero PR churn.
# Candidates only ever land in data/candidates.json; promotion into
# data/plugins.json is a separate, human-reviewed PR.
#
# The org name is not hardcoded here: github.repository already carries it,
# and the scripts read it from package.json "registry".
#
# Setup: repo Settings > Actions > General must have "Allow GitHub Actions to
# create and approve pull requests" enabled, or the pr create step fails.

name: watch

on:
  schedule:
    # Four times a day. The dsh-plugin topic took ~400 new repositories a day
    # through mid-August; a daily sweep leaves the queue a day stale by design.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # A failed scheduled run is a red square on a page nobody opens. The sweep
  # says so in an issue instead.
  issues: write

env:
  DISCOVERY_BRANCH: bot/discovery

jobs:
  discover:
    runs-on: ubuntu-latest
    # An exhaustive sweep is ~110 search calls against a 30/min limit, so it
    # runs in low tens of minutes. Anything past 45 is stuck, not slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover candidates
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/discover.mjs 2>&1 | tee /tmp/discover.log
          # Coverage goes into the PR body: a sweep that read part of a topic
          # and a topic that went quiet produce the same candidate count, and
          # only one of them is fine.
          grep -E '^discover: (topic:|[0-9]+ .*over the)' /tmp/discover.log > /tmp/coverage.txt || true

      # discover.mjs exits non-zero when the topic sweep itself failed, because
      # a run that could not read the ecosystem and a quiet ecosystem produce
      # the same empty queue. Nobody watches the Actions tab on a schedule, so
      # the red square gets a voice: one reused issue, reopened rather than
      # duplicated, closed by hand once a sweep lands clean again.
      - name: Say so when the sweep could not read the ecosystem
        if: failure() && steps.discover.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="watch: the discovery sweep could not read the ecosystem"
          BODY="The scheduled sweep failed on $(date -u +%F' '%T) UTC. The queue and
          \`data/coverage.json\` are unchanged, which means this run has **no opinion**
          about the ecosystem — it does not mean the ecosystem is quiet.

          \`\`\`
          $(tail -20 /tmp/discover.log 2>/dev/null || echo 'no log captured')
          \`\`\`

          [Run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          Usually a GitHub search rate limit; an exhaustive sweep is ~110 search
          calls against a 30/min budget. Close this once a sweep lands clean."
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      # Read every queued repo and say what it is, without writing anything.
      # A queue of bare slugs is work nobody does; a queue that already says
      # "61 of these prove an install path, here is the file for each" is a
      # review. Applying it stays a maintainer's command on purpose — the
      # machine reads, the human admits.
      - name: Triage the queue (report only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/triage.mjs --dry-run 2>&1 | tail -3 | tee /tmp/triage.txt || true

      - name: Validate
        run: node scripts/validate.mjs

      # coverage.json is a measurement, not a queue, and it is what the README
      # prints as its headline. It belongs on main for the same reason
      # stars/pushedAt do: a fact about the outside world, checked rather than
      # judged. It used to be staged nowhere -- the sweep measured the topic
      # universe, wrote the file, and the next step committed only
      # candidates.json, so the measurement was thrown away on every run. The
      # denominator froze at whatever a human last committed by hand while
      # triage.mjs kept advancing the numerator, and the published figure
      # ratcheted toward a fake 100%. Staging it onto the triage branch would
      # not fix it either: that branch is rebuilt from main, not merged.
      - name: Publish the measurement to main
        run: |
          set -euo pipefail
          if git diff --quiet -- data/coverage.json; then
            echo "topic universe unchanged since the last sweep"
            exit 0
          fi
          # The README headline reads coverage.json, and ci.yml runs
          # `render.mjs --check` on every push to main.
          node scripts/render.mjs
          node scripts/validate.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/coverage.json README.md lists docs
          git commit -m "coverage: the sweep re-measured the topic universe"
          # main can move under us while the sweep runs; rebase rather than fail
          git pull --rebase origin main
          git push origin main

      - name: Publish to the reused triage PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/candidates.json; then
            echo "no new candidates; leaving the queue and any open PR untouched"
            exit 0
          fi

          COUNT=$(node -p "JSON.parse(require('fs').readFileSync('data/candidates.json','utf8')).candidates.length")
          TITLE="discovery: ${COUNT} candidate(s) awaiting triage ($(date -u +%F))"
          BODY=$(cat <<EOF
          Automated sweep of every dsh discovery topic, npm, and GitHub code search.

          Coverage this run — each topic swept exhaustively, past GitHub's
          1000-result search cap, by slicing on creation date and star count:

          \`\`\`
          $(cat /tmp/coverage.txt)
          \`\`\`

          What reading them found — \`scripts/triage.mjs --dry-run\`, which
          fetches each repo's own files and looks for an install path:

          \`\`\`
          $(cat /tmp/triage.txt)
          \`\`\`

          To apply that verdict, on a branch off main:

          \`\`\`sh
          npm run triage && npm run render && npm run validate
          \`\`\`

          It writes the provable ones into \`data/plugins.json\` with the file
          each install path was proven in, the unprovable ones into
          \`data/rejected.json\` with a reason and a \`recheckAfter\` date, and
          leaves in the queue only what a machine should not decide: theme
          routing and the close calls. This branch is rebuilt from main and
          force-pushed on every run, so merge or close whenever; the next run
          reopens or refreshes it.
          EOF
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$DISCOVERY_BRANCH"
          git add data/candidates.json
          git commit -m "discovery: refresh candidate queue"
          git push --force origin "$DISCOVERY_BRANCH"

          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$DISCOVERY_BRANCH" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$DISCOVERY_BRANCH" \
              --base main --title "$TITLE" --body "$BODY"
          fi

  # Machine fields only. CONTRIBUTING declares stars/starsUpdated/pushedAt
  # owned by scripts/stars.mjs, so this commits straight to main rather than
  # opening a PR nobody would read. It never touches status, verifiedAgainst,
  # tags, or featured.
  stars:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh stars and push dates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stars.mjs

      # Same class of work: a fact about the outside world, checked rather
      # than judged. It only ever drops a name npm answers 404 for and puts
      # back one that resolves, so a contributor who supplies a correct npm
      # name keeps it and one who supplies a wrong name gets told why. A
      # timeout changes nothing, so a bad npm day is a no-op, not a purge.
      - name: Check npm names still resolve
        run: node scripts/npm-check.mjs

      - name: Re-render and validate
        run: |
          node scripts/render.mjs
          node scripts/validate.mjs

      - name: Commit if anything moved
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "stars unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "stars: refresh counts and push dates; npm names re-checked"
          # main can move under us while the sweep runs; rebase rather than fail
          git pull --rebase origin main
          git push origin main
