# PR gate: the data must pass the schema and the README must be a faithful
# render of it. Keeps "PR against plugins.json only" honest.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/render.mjs --check
